# 공통 설정(design/conventions.md §4). 환경별 값은 application-{local,staging,prod}.yml, 비밀값은 환경변수.
spring:
  application:
    name: data2flow-core-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # 기준 저장소: s3 공용 PostgreSQL DB data2flow, 스키마 data2flow_core(ADR-019). 값은 환경변수(.env / k8s Secret)
  datasource:
    url: jdbc:postgresql://${DATA2FLOW_DB_HOST:localhost}:${DATA2FLOW_DB_PORT:5432}/${DATA2FLOW_DB_NAME:data2flow}?ApplicationName=data2flow-core-api
    username: ${DATA2FLOW_DB_USERNAME:data2flow}
    password: ${DATA2FLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    schemas: data2flow_core
    default-schema: data2flow_core
    create-schemas: true
  # RabbitMQ(s4, vhost: prod data2flow · staging data2flow-stg · local data2flow-dev, ADR-020·030)
  rabbitmq:
    host: ${DATA2FLOW_RABBITMQ_HOST:localhost}
    port: ${DATA2FLOW_RABBITMQ_PORT:5672}
    virtual-host: ${DATA2FLOW_RABBITMQ_VHOST:data2flow-dev}
    username: ${DATA2FLOW_RABBITMQ_USERNAME:guest}
    password: ${DATA2FLOW_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    connection-timeout: 5s
    # RabbitMQ Stream(Super Stream data2flow.telemetry, 실시간 화면). 운영은 10.116.64.14:5552(내부망 전용)
    stream:
      host: ${DATA2FLOW_RABBITMQ_HOST:localhost}
      port: ${DATA2FLOW_RABBITMQ_STREAM_PORT:5552}
      virtual-host: ${DATA2FLOW_RABBITMQ_VHOST:data2flow-dev}
      username: ${DATA2FLOW_RABBITMQ_USERNAME:guest}
      password: ${DATA2FLOW_RABBITMQ_PASSWORD:guest}
  messages:
    # 도메인별 문구 묶음(ADR-037: ko 원문, en·ja·zh). 오류 문구 키는 error.<코드>
    basename: messages,i18n/space,i18n/catalog,i18n/device,i18n/source,i18n/script,i18n/annotation,i18n/telemetry,i18n/live,i18n/control,i18n/flow,i18n/sim,i18n/alarm,i18n/board
    encoding: UTF-8
    fallback-to-system-locale: false
server:
  port: 8080
  shutdown: graceful

# actuator는 8081(프로브·지표 전용, k8s Service로 노출하지 않음)
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # RabbitMQ·메일이 잠시 없어도 readiness를 떨어뜨리지 않는다(아웃박스가 나중에 보낸다)
    rabbit:
      enabled: false
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

data2flow:
  identity:
    # 공개 경로(design/auth.md §3.3). 신원 헤더가 있으면 담고 없으면 통과한다
    optional-paths:
      - /core/invitations/*
      - /core/invitations/*/login-id-availability
      - /core/invitations/*/accept
      - /core/password-resets
      - /core/password-resets/*/confirm
      - /core/signup-requests
      - /core/signup-requests/*/verify
      - /core/public/**
  idempotency:
    jdbc-table: data2flow_core.idempotency_keys
  secrets:
    # 비밀값 암호화 키(NFR-03.02): "kid:Base64 32바이트,…". k8s Secret data2flow-master-key / 로컬 .env
    master-keys: ${DATA2FLOW_SECRETS_MASTER_KEYS:}
    active-key-id: ${DATA2FLOW_SECRETS_ACTIVE_KEY_ID:}
  core:
    web-base-url: ${DATA2FLOW_WEB_BASE_URL:https://data2flow.java21.net}
    auth-base-url: ${DATA2FLOW_AUTH_BASE_URL:http://data2flow-auth}
    # ADR-030: DB를 staging·prod가 함께 쓰므로 migrate는 staging 배포에서만(application-staging.yml)
    flyway-mode: validate
    # ADR-030: 이 배포가 맡는 조직 코드(staging 전용 조직). 비우면 ACTIVE 조직이 하나일 때 그 조직(ADR-004)
    organization-code: ${DATA2FLOW_ORGANIZATION_CODE:}
    ingress-base-url: ${DATA2FLOW_INGRESS_BASE_URL:http://data2flow-ingress}
    pipeline-base-url: ${DATA2FLOW_PIPELINE_BASE_URL:http://data2flow-pipeline}
    password:
      hibp-enabled: ${DATA2FLOW_PASSWORD_HIBP_ENABLED:false}
    bootstrap:
      organization-code: ${DATA2FLOW_BOOTSTRAP_ORG_CODE:default}
      organization-name: ${DATA2FLOW_BOOTSTRAP_ORG_NAME:data2flow}
      admin-login-id: ${DATA2FLOW_BOOTSTRAP_ADMIN_LOGIN_ID:}
      admin-email: ${DATA2FLOW_BOOTSTRAP_ADMIN_EMAIL:}
      admin-initial-password: ${DATA2FLOW_BOOTSTRAP_ADMIN_INITIAL_PASSWORD:}
      password-output-file: ${DATA2FLOW_BOOTSTRAP_PASSWORD_FILE:}
    # 기본 모델 6종·측정 항목을 시작할 때 이 배포의 ACTIVE 조직마다 채운다(DEV-03.02, 멱등). 로컬 프로필은 끈다(공용 DB)
    catalog:
      seed-on-startup: ${DATA2FLOW_CATALOG_SEED_ON_STARTUP:true}
    # M3 가상 폐루프: 외부 경로를 core가 열고 내부 API로 넘기는 서비스(ADR-021 HTTP 80, 토큰 없음)
    loop:
      action-base-url: ${DATA2FLOW_ACTION_BASE_URL:http://data2flow-action}
      flow-engine-base-url: ${DATA2FLOW_FLOW_ENGINE_BASE_URL:http://data2flow-flow-engine}
      simulator-base-url: ${DATA2FLOW_SIMULATOR_BASE_URL:http://data2flow-simulator}
      # 시작할 때 ACTIVE 조직마다 SIM 소스·하트비트 기기(__heartbeat__)·가상 드라이버를 보장(멱등)
      seed-on-startup: ${DATA2FLOW_SIM_SEED_ON_STARTUP:true}
