# 로컬 개발. 인프라는 s3 SSH 터널·공용 개발 DB로 붙는다(design/deployment.md §8.2). 비밀값은 루트 .env를 셸에 읽어 둔다
# (set -a; source ../.env; set +a). 공용 DB이므로 Flyway는 validate만 한다(ADR-030). 아웃박스·정리 작업은 끈다:
# 로컬이 운영과 같은 DB의 아웃박스를 대신 보내거나 정리하지 않게 한다.
logging:
  level:
    net.java21.data2flow: DEBUG
data2flow:
  core:
    outbox:
      relay-enabled: false
    jobs:
      enabled: false
    # 로컬은 이벤트 큐(core.events)를 소비하지 않는다: vhost data2flow-dev를 개발자끼리 함께 쓰므로 같은 큐를 나눠 갖게 된다
    events:
      listener-enabled: false
    # 실시간 화면의 텔레메트리 소비자 그룹 접미사(core-live-<이름>, deployment.md §8.2)
    live:
      developer: ${DATA2FLOW_DEVELOPER:}
    # 공용 DB에 기본 카탈로그를 쓰지 않는다(조직 생성·운영 배포가 채운다)
    catalog:
      seed-on-startup: false
    # 공용 DB에 가상 환경 기본값을 쓰지 않는다
    loop:
      seed-on-startup: false
