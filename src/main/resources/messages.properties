mail.invitation.subject=[{0}] data2flow 초대
mail.invitation.body={0}에서 data2flow에 초대했습니다.\n\n아래 링크에서 로그인 아이디와 비밀번호를 정해 계정을 활성화하세요.\n{1}\n\n링크는 {2}까지 한 번만 쓸 수 있습니다.\n\n수집하는 개인정보: 이름, 이메일, 연락처(선택). 목적: 계정 관리와 알림. 탈퇴·삭제를 요청하면 익명화합니다.
mail.password-reset.subject=data2flow 비밀번호 재설정
mail.password-reset.body={0}님, 비밀번호 재설정을 요청하셨습니다.\n\n아래 링크에서 새 비밀번호를 정하세요. 링크는 {2}까지 한 번만 쓸 수 있습니다.\n{1}\n\n요청하지 않았다면 이 메일을 무시하세요.
mail.signup-verify.subject=[{0}] 가입 신청 이메일 확인
mail.signup-verify.body={0} 가입 신청을 받았습니다.\n\n아래 링크로 이메일을 확인하면 관리자 승인을 기다립니다. 링크는 {2}까지 유효합니다.\n{1}
mail.signup-duplicate.subject=[{0}] 가입 신청 안내
mail.signup-duplicate.body=이 이메일은 {0}에 이미 가입했거나 신청 중입니다. 로그인하거나 비밀번호 재설정을 이용해 주세요.
mail.signup-approved.subject=data2flow 가입이 승인되었습니다
mail.signup-approved.body={0}님, 가입이 승인되었습니다. 아래에서 로그인하세요.\n{1}
mail.signup-rejected.subject=data2flow 가입 신청 결과
