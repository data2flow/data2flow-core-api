# dataexchange 문구(ADR-037: ko 원문, en·ja·zh 번역). 내보내기·가져오기·정기 내보내기·데이터 사전(TSD-04·07)
error.EXPORT_NOT_FOUND=내보내기 작업을 찾을 수 없습니다
error.EXPORT_EXPIRED=내보내기 파일이나 다운로드 링크의 보관 기간이 지났습니다. 다시 내보내기 하세요
error.EXPORT_LIMIT_EXCEEDED=진행 중인 내보내기 작업이 너무 많습니다(최대 3개). 끝난 뒤 다시 시도하세요
error.EXPORT_TARGET_UNWRITABLE=대상에 파일을 쓸 수 없습니다: {0}
error.EXPORT_STATE_CONFLICT=이미 끝난 작업입니다
error.IMPORT_NOT_FOUND=가져오기 작업을 찾을 수 없습니다
error.IMPORT_FILE_INVALID=가져올 파일을 읽을 수 없습니다: {0}
error.IMPORT_LIMIT_EXCEEDED=한 번에 가져올 수 있는 한도를 넘었습니다(5,000만 행·2GB)
error.IMPORT_SOURCE_UNREACHABLE=가져올 원천에 연결할 수 없습니다: {0}
error.IMPORT_STATE_CONFLICT=지금 상태에서는 실행할 수 없습니다. 미리 실행이 끝난 작업만 실행할 수 있습니다
mail.export-schedule.subject=[data2flow] 정기 내보내기 "{0}" 파일이 준비되었습니다
mail.export-schedule.body=정기 내보내기 "{0}"의 {1} ~ {2} 데이터 파일이 준비되었습니다.\n내려받기: {3}\n파일은 7일 동안 보관됩니다.
