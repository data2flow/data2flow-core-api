# telemetry 문구(ADR-037: ko 원문, en·ja·zh 번역). 오류 error.<코드>, 수집 경고 ingest.alert.<코드>
error.TSD_RANGE_TOO_LARGE=生データは一度に31日まで照会できます。集計単位を選ぶかエクスポートを利用してください
error.TSD_TOO_MANY_SERIES=一度に比較できる時系列は50個までです
error.TSD_RESOLUTION_UNAVAILABLE=この期間の{0}データは保管されていません
error.TSD_INVALID_AGG=この測定項目には{0}を使用できません
error.WIDGET_QUERY_INVALID=1つのチャートで比較できる空間は最大6か所です
error.DEVICE_NOT_FOUND=機器が見つかりません
error.ING_QUERY_RANGE_TOO_LARGE=照会期間は最大31日です
error.ING_RAW_MESSAGE_NOT_FOUND=メッセージが見つかりません
error.ING_PAYLOAD_FORBIDDEN=原文を表示する権限がありません
error.ING_DLQ_ITEM_LOCKED=別のユーザーが処理中です
error.ING_DLQ_BATCH_TOO_LARGE=一度に再処理できるのは最大5,000件です
error.ING_REPROCESS_ALREADY_RUNNING=このソースで実行中の再処理ジョブがあります
error.ING_REPROCESS_OUT_OF_RETENTION=原文が保管されている期間のみ再処理できます
error.ING_REPROCESS_NOT_CANCELLABLE=すでに終了したジョブです
ingest.alert.INGEST_STOPPED=収集が停止しています。有効なソースからメッセージが届いていません
ingest.alert.INGEST_LAG_HIGH=受信メッセージの処理が遅れています
ingest.alert.DLQ_GROWING=処理失敗メッセージが急増しています
