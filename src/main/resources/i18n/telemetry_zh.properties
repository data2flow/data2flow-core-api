# telemetry 문구(ADR-037: ko 원문, en·ja·zh 번역). 오류 error.<코드>, 수집 경고 ingest.alert.<코드>
error.TSD_RANGE_TOO_LARGE=原始数据一次最多可查询31天。请选择聚合粒度或使用导出
error.TSD_TOO_MANY_SERIES=一次最多可比较50个时间序列
error.TSD_RESOLUTION_UNAVAILABLE=该期间未保存{0}数据
error.TSD_INVALID_AGG=该测量项不能使用{0}
error.WIDGET_QUERY_INVALID=一个图表最多可比较 6 个空间
error.DEVICE_NOT_FOUND=找不到设备
error.ING_QUERY_RANGE_TOO_LARGE=查询期间最长为31天
error.ING_RAW_MESSAGE_NOT_FOUND=找不到消息
error.ING_PAYLOAD_FORBIDDEN=没有查看原始数据的权限
error.ING_DLQ_ITEM_LOCKED=其他用户正在处理
error.ING_DLQ_BATCH_TOO_LARGE=一次最多可重新处理5,000条
error.ING_REPROCESS_ALREADY_RUNNING=该数据源已有正在运行的重新处理任务
error.ING_REPROCESS_OUT_OF_RETENTION=只能重新处理原始消息仍在保存期内的期间
error.ING_REPROCESS_NOT_CANCELLABLE=该任务已结束
ingest.alert.INGEST_STOPPED=采集已停止。活动数据源没有传来消息
ingest.alert.INGEST_LAG_HIGH=接收消息的处理出现积压
ingest.alert.DLQ_GROWING=处理失败的消息正在快速增加
