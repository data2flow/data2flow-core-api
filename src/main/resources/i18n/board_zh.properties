# board 文案(自定义仪表板、共享链接、品牌、IFC 模型)。错误 error.<代码>
error.DASHBOARD_NOT_FOUND=找不到仪表板
error.DASHBOARD_VERSION_CONFLICT=其他用户已先保存。请重新加载最新内容
error.DASHBOARD_LAYOUT_INVALID=仪表板布局无效(24 列网格,最多 40 个小部件,不得重叠)
error.WIDGET_TYPE_UNSUPPORTED=不支持的小部件类型
error.WIDGET_QUERY_INVALID=小部件查询条件无效
error.WIDGET_DATA_FORBIDDEN=无权查看此小部件的数据
error.SHARE_LINK_INVALID=链接无效
error.BRANDING_ASSET_INVALID=品牌文件无效(PNG、SVG 不超过 1MB,SVG 不得包含脚本或外部引用)
error.MODEL_FILE_INVALID=不是 IFC 文件或超过 200MB(须 200MB 以下)
error.SPACE_NOT_FOUND=找不到空间
