# board 문구(사용자 정의 대시보드·공유 링크·브랜딩·IFC 모델, ADR-037: ko 원문, en·ja·zh 번역). 오류 error.<코드>
error.DASHBOARD_NOT_FOUND=대시보드를 찾을 수 없습니다
error.DASHBOARD_VERSION_CONFLICT=다른 사용자가 먼저 저장했습니다. 최신 내용을 다시 불러와 주세요
error.DASHBOARD_LAYOUT_INVALID=대시보드 배치가 올바르지 않습니다(24열 격자, 위젯 40개 이하, 겹침 없음)
error.WIDGET_TYPE_UNSUPPORTED=지원하지 않는 위젯 종류입니다
error.WIDGET_QUERY_INVALID=위젯 조회 조건이 올바르지 않습니다
error.WIDGET_DATA_FORBIDDEN=이 위젯의 데이터를 볼 권한이 없습니다
error.SHARE_LINK_INVALID=유효하지 않은 링크입니다
error.BRANDING_ASSET_INVALID=브랜딩 파일이 올바르지 않습니다(PNG·SVG 1MB 이하, SVG 스크립트·외부 참조 금지)
error.MODEL_FILE_INVALID=IFC 파일이 아니거나 200MB를 넘습니다(200MB 이하)
error.SPACE_NOT_FOUND=공간을 찾을 수 없습니다
