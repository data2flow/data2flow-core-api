# dataexchange (zh)
error.EXPORT_NOT_FOUND=找不到导出任务
error.EXPORT_EXPIRED=导出文件或下载链接已过期,请重新导出
error.EXPORT_LIMIT_EXCEEDED=进行中的导出任务过多(最多 3 个),请在完成后重试
error.EXPORT_TARGET_UNWRITABLE=无法向目标写入文件: {0}
error.EXPORT_STATE_CONFLICT=任务已经结束
error.IMPORT_NOT_FOUND=找不到导入任务
error.IMPORT_FILE_INVALID=无法读取导入文件: {0}
error.IMPORT_LIMIT_EXCEEDED=超过单次导入上限(5000 万行、2GB)
error.IMPORT_SOURCE_UNREACHABLE=无法连接导入源: {0}
error.IMPORT_STATE_CONFLICT=当前状态无法执行。只有预演完成的任务才能执行
mail.export-schedule.subject=[data2flow] 定期导出“{0}”的文件已就绪
mail.export-schedule.body=定期导出“{0}”的 {1} ~ {2} 数据文件已就绪。\n下载: {3}\n文件保留 7 天。
dictionary.table.telemetry=原始测量值(长格式)。与导出的 CSV、Parquet 文件列相同
dictionary.table.telemetry_aggregate=1 分钟、1 小时、1 天聚合值(长格式)。value 为所选聚合方式的值,quality 为空
dictionary.quality.0=正常
dictionary.quality.1=超出有效范围
dictionary.quality.2=未验证的测量项
dictionary.quality.3=可疑值
dictionary.quality.4=时间已校正
dictionary.quality.5=预报值
dictionary.agg.avg=平均值
dictionary.agg.min=最小值
dictionary.agg.max=最大值
dictionary.agg.sum=合计
dictionary.agg.last=最后值
dictionary.agg.count=样本数
dictionary.agg.twa=时间加权平均
dictionary.telemetry.column.time=测量时间(所选时区, ISO-8601)
dictionary.telemetry_aggregate.column.time=测量时间(所选时区, ISO-8601)
dictionary.telemetry.column.device_id=设备 ID
dictionary.telemetry_aggregate.column.device_id=设备 ID
dictionary.telemetry.column.device_name=设备名称
dictionary.telemetry_aggregate.column.device_name=设备名称
dictionary.telemetry.column.space_path=空间路径(站点/建筑/楼层/空间)
dictionary.telemetry_aggregate.column.space_path=空间路径(站点/建筑/楼层/空间)
dictionary.telemetry.column.metric=测量项键
dictionary.telemetry_aggregate.column.metric=测量项键
dictionary.telemetry.column.value=值(存储单位)
dictionary.telemetry_aggregate.column.value=值(存储单位)
dictionary.telemetry.column.unit=存储单位
dictionary.telemetry_aggregate.column.unit=存储单位
dictionary.telemetry.column.quality=质量代码(见下表)
dictionary.telemetry_aggregate.column.quality=质量代码(见下表)
