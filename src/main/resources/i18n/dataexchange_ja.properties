dictionary.telemetry.column.metric=測定項目キー
dictionary.telemetry_aggregate.column.metric=測定項目キー
dictionary.telemetry.column.value=値(保存単位)
dictionary.telemetry_aggregate.column.value=値(保存単位)
dictionary.telemetry.column.unit=保存単位
dictionary.telemetry_aggregate.column.unit=保存単位
