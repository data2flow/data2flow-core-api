# dataexchange (ja)
error.EXPORT_NOT_FOUND=エクスポートジョブが見つかりません
error.EXPORT_EXPIRED=エクスポートファイルまたはダウンロードリンクの有効期限が切れました。もう一度エクスポートしてください
error.EXPORT_LIMIT_EXCEEDED=実行中のエクスポートジョブが多すぎます(最大3件)。終了後に再試行してください
error.EXPORT_TARGET_UNWRITABLE=出力先にファイルを書き込めません: {0}
error.EXPORT_STATE_CONFLICT=すでに終了したジョブです
error.IMPORT_NOT_FOUND=インポートジョブが見つかりません
error.IMPORT_FILE_INVALID=インポートファイルを読み取れません: {0}
error.IMPORT_LIMIT_EXCEEDED=一度にインポートできる上限(5,000万行・2GB)を超えました
error.IMPORT_SOURCE_UNREACHABLE=インポート元に接続できません: {0}
error.IMPORT_STATE_CONFLICT=現在の状態では実行できません。プレビュー実行が終わったジョブのみ実行できます
mail.export-schedule.subject=[data2flow] 定期エクスポート「{0}」のファイルが準備できました
mail.export-schedule.body=定期エクスポート「{0}」の {1} ~ {2} のデータファイルが準備できました。\nダウンロード: {3}\nファイルは7日間保管されます。
dictionary.table.telemetry=生の測定値(縦持ち)。エクスポートCSV・Parquetの列と同じです
dictionary.table.telemetry_aggregate=1分・1時間・1日集計値(縦持ち)。valueは選択した集計方法の値で、qualityは空です
dictionary.quality.0=正常
dictionary.quality.1=有効範囲外
dictionary.quality.2=未検証の測定項目
dictionary.quality.3=疑わしい値
dictionary.quality.4=時刻補正済み
dictionary.quality.5=予報値
dictionary.agg.avg=平均
dictionary.agg.min=最小
dictionary.agg.max=最大
dictionary.agg.sum=合計
dictionary.agg.last=最後の値
dictionary.agg.count=サンプル数
dictionary.agg.twa=時間加重平均
dictionary.telemetry.column.time=測定時刻(選択したタイムゾーン, ISO-8601)
dictionary.telemetry_aggregate.column.time=測定時刻(選択したタイムゾーン, ISO-8601)
dictionary.telemetry.column.device_id=機器ID
