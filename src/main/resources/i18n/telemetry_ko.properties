# telemetry 문구(ADR-037: ko 원문, en·ja·zh 번역). 오류 error.<코드>, 수집 경고 ingest.alert.<코드>
# 시계열 조회(TSD, spec/detail/TSD/domain-model.md §5)
error.TSD_RANGE_TOO_LARGE=원본 데이터는 한 번에 31일까지 조회할 수 있습니다. 집계 단위를 고르거나 내보내기를 이용하세요
error.TSD_TOO_MANY_SERIES=한 번에 50개 시계열까지 비교할 수 있습니다
error.TSD_RESOLUTION_UNAVAILABLE=이 기간에는 {0} 데이터가 보관되어 있지 않습니다
error.TSD_INVALID_AGG=이 측정 항목에는 {0}를 쓸 수 없습니다
error.WIDGET_QUERY_INVALID=한 차트에 비교할 수 있는 공간은 최대 6곳입니다
error.DEVICE_NOT_FOUND=기기를 찾을 수 없습니다
# 수집 관리(ING, spec/detail/ING/domain-model.md 오류 코드)
error.ING_QUERY_RANGE_TOO_LARGE=조회 기간은 최대 31일입니다
error.ING_RAW_MESSAGE_NOT_FOUND=메시지를 찾을 수 없습니다
error.ING_PAYLOAD_FORBIDDEN=원본 보기 권한이 없습니다
error.ING_DLQ_ITEM_LOCKED=다른 사용자가 처리 중입니다
error.ING_DLQ_BATCH_TOO_LARGE=한 번에 최대 5,000건까지 재처리할 수 있습니다
error.ING_REPROCESS_ALREADY_RUNNING=이 소스에 실행 중인 재처리 작업이 있습니다
error.ING_REPROCESS_OUT_OF_RETENTION=원본이 보관된 기간만 재처리할 수 있습니다
error.ING_REPROCESS_NOT_CANCELLABLE=이미 끝난 작업입니다
ingest.alert.INGEST_STOPPED=수집이 멈췄습니다. 활성 소스에서 들어온 메시지가 없습니다
ingest.alert.INGEST_LAG_HIGH=수신한 메시지 처리가 밀리고 있습니다
ingest.alert.DLQ_GROWING=처리 실패 메시지가 빠르게 늘고 있습니다
