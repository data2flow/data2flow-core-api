# 테스트 프로필(design/testing/backend.md §2). 인프라 주소는 @DynamicPropertySource로 Testcontainers 값을 넣는다.
# 실제 s3·s4 인프라에는 붙지 않는다. 비밀값은 고정 더미다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:1/never-used
    # 시험 문맥이 여럿 캐시되므로 문맥마다 연결을 적게(내보내기 동기 실행 + 요청 + 주기 작업이면 충분)
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
  rabbitmq:
    host: localhost
    port: 1
    virtual-host: /
data2flow:
  secrets:
    master-keys: test1:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  core:
    flyway-mode: migrate
    # M5 엣지(DSC-08.04): 게시된 에이전트 버전(마지막이 최신)
    edge:
      agent-versions: 1.0.0,1.1.0
    web-base-url: https://web.test
    outbox:
      relay-enabled: false
    jobs:
      enabled: false
    # M5 내보내기·가져오기·정기 내보내기: 주기 작업은 끄고 테스트가 직접 부른다. 캐시는 캐시 IT만 켠다(Redis 컨테이너)
    exchange:
      jobs-enabled: false
      sync-timeout: PT20S
    telemetry-cache:
      enabled: false
    # 실시간 화면(WP-F): 텔레메트리 스트림은 스트림 IT만 켜고, 주기 작업은 테스트가 직접 부른다
    live:
      telemetry-enabled: false
      scheduler-enabled: false
    # M3: 내부 서비스 주소는 IT가 대역 서버로 바꾼다. 주기 작업·시드는 테스트가 직접 부른다
    loop:
      sim-tick-enabled: false
      seed-on-startup: false
      relay-timeout: 3s
logging:
  level:
    net.java21.data2flow: INFO
# M5 외부 맥락: 실제 공공 API에 붙지 않는다(닫힌 포트). iCal은 대역 HTTP 서버(http://)를 쓰므로 http 허용
data2flow.core.external:
  kma-base-url: http://127.0.0.1:1/kma
  airkorea-base-url: http://127.0.0.1:1/airkorea
  holiday-base-url: http://127.0.0.1:1/holiday
  ical-allow-http: true
  http-timeout: 3s
